<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>換裝舞臺 · 魔法小皇宮</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ff7ac0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="魔法小皇宮" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>"
    />
    <style>
      .du-layout {
        display: flex;
        gap: 22px;
        align-items: stretch;
      }
      @media (max-width: 900px) {
        .du-layout {
          flex-direction: column;
        }
      }
      .stage {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #fff6fb 0%, #f3ecff 100%);
        padding: 10px;
      }
      #doll {
        width: 100%;
        max-width: 440px;
        height: auto;
        border-radius: 18px;
        overflow: hidden;
      }
      #doll.bounce {
        animation: doll-bounce 0.4s ease;
      }
      @keyframes doll-bounce {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        40% {
          transform: translateY(-8px) scale(1.02);
        }
      }
      .wardrobe {
        width: 420px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
      }
      @media (max-width: 900px) {
        .wardrobe {
          width: 100%;
        }
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-bottom: 14px;
      }
      .tab {
        font-family: var(--font-cute);
        font-weight: 800;
        font-size: 17px;
        border: none;
        border-radius: 16px;
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.75);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.07);
        transition: transform 0.08s;
      }
      .tab.active {
        background: linear-gradient(180deg, var(--pink) 0%, var(--pink-deep) 100%);
        color: #fff;
      }
      .tab:active {
        transform: translateY(2px);
      }
      .options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        overflow-y: auto;
        align-content: start;
        flex: 1;
        max-height: 460px;
        padding: 4px;
      }
      .opt {
        background: #fff;
        border: 4px solid transparent;
        border-radius: 20px;
        padding: 14px 8px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.1s, border-color 0.1s;
        box-shadow: 0 4px 10px rgba(90, 61, 107, 0.14);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-height: 104px;
        justify-content: center;
      }
      .opt:hover {
        transform: translateY(-3px);
      }
      .opt:active {
        transform: scale(0.97);
      }
      .opt.sel {
        border-color: var(--pink-deep);
        background: #fff0f7;
      }
      .opt .swatch {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        box-shadow: inset 0 -3px 7px rgba(0, 0, 0, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
      }
      .opt .nm {
        font-size: 17px;
        font-weight: 800;
        line-height: 1.2;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        align-items: center;
      }
      .toolbar .btn {
        font-size: 19px;
        padding: 13px 24px;
      }
      .topbar h1 {
        font-size: clamp(24px, 4.5vw, 38px);
      }
      .hint-big {
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="btn ghost btn-back" href="index.html">🏰 回城堡</a>
        <h1>🎭 換裝舞臺</h1>
        <span id="sound-slot"></span>
      </div>

      <div class="toolbar">
        <button class="btn purple" id="btn-random">🎲 隨機造型</button>
        <button class="btn ghost" id="btn-reset">♻️ 重新開始</button>
        <button class="btn gold" id="btn-photo">📸 拍照儲存</button>
        <span class="badge hint-big" style="margin-left: auto"
          >幫公主和王子打扮吧 💕</span
        >
      </div>

      <div class="du-layout">
        <div class="stage panel">
          <svg id="doll" viewBox="0 0 360 520" style="--skin: #ffe0bd">
            <defs>
              <style>
                .skin {
                  fill: var(--skin);
                }
                .skin-stroke {
                  stroke: var(--skin);
                  fill: none;
                }
              </style>
              <radialGradient id="iris" cx="0.5" cy="0.38" r="0.62">
                <stop offset="0" stop-color="#b98a52" />
                <stop offset="1" stop-color="#6b4424" />
              </radialGradient>
            </defs>

            <!-- 場景背景 -->
            <g id="scene"></g>
            <!-- 後方頭髮 -->
            <g id="backhair"></g>

            <!-- 身體（固定，膚色可換） -->
            <g id="body">
              <!-- 腿 -->
              <path class="skin-stroke" d="M164 322 L162 486" stroke-width="24" stroke-linecap="round" />
              <path class="skin-stroke" d="M196 322 L198 486" stroke-width="24" stroke-linecap="round" />
              <!-- 軀幹 -->
              <path class="skin" d="M150 200 Q180 192 210 200 L208 322 L152 322 Z" />
              <!-- 手臂 -->
              <path class="skin-stroke" d="M150 208 Q140 270 146 330" stroke-width="20" stroke-linecap="round" />
              <path class="skin-stroke" d="M210 208 Q220 270 214 330" stroke-width="20" stroke-linecap="round" />
              <circle class="skin" cx="146" cy="332" r="12" />
              <circle class="skin" cx="214" cy="332" r="12" />
              <!-- 脖子 -->
              <rect class="skin" x="168" y="176" width="24" height="28" rx="8" />
              <!-- 耳朵 -->
              <circle class="skin" cx="114" cy="126" r="13" />
              <circle class="skin" cx="246" cy="126" r="13" />
              <!-- 頭 -->
              <circle class="skin" cx="180" cy="120" r="70" />
              <!-- 臉 -->
              <g id="face">
                <!-- 眉毛 -->
                <path d="M144 100 Q158 92 172 99" stroke="#c98a5e" stroke-width="4" fill="none" stroke-linecap="round" />
                <path d="M188 99 Q202 92 216 100" stroke="#c98a5e" stroke-width="4" fill="none" stroke-linecap="round" />
                <!-- 左眼 -->
                <ellipse cx="158" cy="126" rx="16" ry="20" fill="#fff" />
                <circle cx="159" cy="128" r="13" fill="url(#iris)" />
                <circle cx="159" cy="130" r="6.5" fill="#2a1a16" />
                <circle cx="153" cy="120" r="4.6" fill="#fff" />
                <circle cx="164" cy="135" r="2.6" fill="#fff" opacity="0.85" />
                <path d="M140 119 Q158 103 177 119" stroke="#2a1a14" stroke-width="3.6" fill="none" stroke-linecap="round" />
                <path d="M140 119 q-5 -3 -9 -1" stroke="#2a1a14" stroke-width="3" fill="none" stroke-linecap="round" />
                <!-- 右眼 -->
                <ellipse cx="202" cy="126" rx="16" ry="20" fill="#fff" />
                <circle cx="201" cy="128" r="13" fill="url(#iris)" />
                <circle cx="201" cy="130" r="6.5" fill="#2a1a16" />
                <circle cx="195" cy="120" r="4.6" fill="#fff" />
                <circle cx="206" cy="135" r="2.6" fill="#fff" opacity="0.85" />
                <path d="M183 119 Q201 103 220 119" stroke="#2a1a14" stroke-width="3.6" fill="none" stroke-linecap="round" />
                <path d="M220 119 q5 -3 9 -1" stroke="#2a1a14" stroke-width="3" fill="none" stroke-linecap="round" />
                <!-- 鼻 -->
                <path d="M177 140 q3 4 6 1" stroke="#e0a886" stroke-width="2.4" fill="none" stroke-linecap="round" />
                <!-- 嘴 -->
                <path d="M169 154 Q180 168 191 154" stroke="#d9627c" stroke-width="3.6" fill="none" stroke-linecap="round" />
                <path d="M175 158 Q180 163 185 158 Q180 161 175 158 Z" fill="#ff9eb4" />
                <!-- 腮紅 -->
                <ellipse cx="146" cy="148" rx="12" ry="8" fill="#ff9ec2" opacity="0.5" />
                <ellipse cx="214" cy="148" rx="12" ry="8" fill="#ff9ec2" opacity="0.5" />
              </g>
            </g>

            <!-- 服裝 -->
            <g id="dress"></g>
            <!-- 鞋子 -->
            <g id="shoes"></g>
            <!-- 前方瀏海 -->
            <g id="fronthair"></g>
            <!-- 皇冠 / 頭飾 -->
            <g id="crown"></g>
          </svg>
        </div>

        <div class="wardrobe panel">
          <div class="tabs" id="tabs"></div>
          <div class="options" id="options"></div>
        </div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/dressup.js"></script>
  </body>
</html>
