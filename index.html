<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魔法小皇宮 ✨</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ff7ac0" />
    <meta
      name="description"
      content="魔法小皇宮：給小朋友的迪士尼風小遊戲 — 公主換裝、記憶配對、關係配對。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="魔法小皇宮" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>"
    />
    <style>
      .hero {
        text-align: center;
        margin-top: 8px;
      }
      .castle-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
        margin: 26px auto 0;
        max-width: 1080px;
      }
      @media (max-width: 860px) {
        .castle-grid {
          grid-template-columns: repeat(2, 1fr);
          max-width: 620px;
        }
      }
      @media (max-width: 540px) {
        .castle-grid {
          grid-template-columns: 1fr;
          max-width: 380px;
        }
      }
      .castle-card {
        position: relative;
        border-radius: 28px;
        padding: 18px 16px 22px;
        text-decoration: none;
        color: var(--ink);
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform 0.18s cubic-bezier(0.2, 1.3, 0.4, 1),
          box-shadow 0.18s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
      }
      .castle-card:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 22px 44px rgba(90, 61, 107, 0.35);
      }
      .castle-card:active {
        transform: translateY(-2px) scale(1);
      }
      .card-aladdin {
        background: linear-gradient(180deg, #ffe7a8 0%, #ffd0e0 100%);
      }
      .card-frozen {
        background: linear-gradient(180deg, #d8f3ff 0%, #b9e0ff 100%);
      }
      .card-snow {
        background: linear-gradient(180deg, #d6f5d8 0%, #cfe8ff 100%);
      }
      .card-rapunzel {
        background: linear-gradient(180deg, #e3d4ff 0%, #ffd9ef 100%);
      }
      .card-belle {
        background: linear-gradient(180deg, #fff0d6 0%, #ffe0e8 100%);
      }
      .card-mulan {
        background: linear-gradient(180deg, #ffe6cf 0%, #ffd2d2 100%);
      }
      .card-mermaid {
        background: linear-gradient(180deg, #c4f3ec 0%, #a8e0f5 100%);
      }
      .castle-card svg {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.12));
      }
      .castle-card .game-name {
        font-size: 24px;
        font-weight: 900;
        margin: 14px 0 2px;
      }
      .castle-card .game-region {
        font-size: 15px;
        opacity: 0.7;
        font-weight: 700;
      }
      .castle-card .play-pill {
        margin-top: 12px;
        background: rgba(255, 255, 255, 0.85);
        color: var(--pink-deep);
        font-weight: 900;
        padding: 8px 20px;
        border-radius: 999px;
        font-size: 17px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      }
      .card-frozen .play-pill {
        color: var(--ice-deep);
      }
      .card-snow .play-pill {
        color: #3fa55a;
      }
      .card-rapunzel .play-pill {
        color: #8a5cd0;
      }
      .card-belle .play-pill {
        color: #d99a3a;
      }
      .card-mulan .play-pill {
        color: #d23b3b;
      }
      .card-mermaid .play-pill {
        color: #2a9fc0;
      }
      .ribbon {
        position: absolute;
        top: 14px;
        right: -34px;
        transform: rotate(40deg);
        background: var(--pink-deep);
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        padding: 4px 40px;
        box-shadow: var(--shadow);
      }
      .footer-note {
        text-align: center;
        margin-top: 34px;
        color: #8a6aa0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <h1 class="title-fancy">魔法小皇宮</h1>
        <p class="subtitle">✨ 選一座城堡，開始你的魔法冒險吧！ ✨</p>
      </div>

      <div style="text-align: right">
        <span id="sound-slot"></span>
      </div>

      <div class="castle-grid">
        <!-- 阿拉丁：換裝 -->
        <a class="castle-card card-aladdin" href="dressup.html">
          <span class="ribbon">換裝</span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <!-- 沙丘 -->
            <ellipse cx="100" cy="185" rx="120" ry="22" fill="#f6c869" />
            <!-- 主塔身 -->
            <rect x="70" y="80" width="60" height="100" rx="6" fill="#f4b942" />
            <rect x="40" y="110" width="34" height="70" rx="5" fill="#f0a830" />
            <rect x="126" y="110" width="34" height="70" rx="5" fill="#f0a830" />
            <!-- 洋蔥圓頂 -->
            <path
              d="M100 26 C124 50 124 74 100 80 C76 74 76 50 100 26 Z"
              fill="#ffd95e"
            />
            <circle cx="100" cy="22" r="5" fill="#fff3b0" />
            <path
              d="M57 86 C72 102 72 118 57 122 C42 118 42 102 57 86 Z"
              fill="#ffcf57"
            />
            <path
              d="M143 86 C158 102 158 118 143 122 C128 118 128 102 143 86 Z"
              fill="#ffcf57"
            />
            <!-- 門與窗 -->
            <path d="M88 180 v-34 a12 12 0 0 1 24 0 v34 Z" fill="#9c5b1f" />
            <circle cx="100" cy="108" r="8" fill="#fff3c4" />
            <!-- 旗 -->
            <rect x="99" y="6" width="2" height="16" fill="#b9772a" />
            <path d="M101 8 l14 5 l-14 5 Z" fill="#ff7aa8" />
          </svg>
          <div class="game-name">換裝舞臺</div>
          <div class="game-region">🕌 阿拉丁神燈宮殿</div>
          <div class="play-pill">開始遊戲 ▶</div>
        </a>

        <!-- 冰雪：記憶配對 -->
        <a class="castle-card card-frozen" href="memory.html">
          <span class="ribbon" style="background: var(--ice-deep)">配對</span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="185" rx="120" ry="22" fill="#eaf6ff" />
            <!-- 冰晶塔 -->
            <polygon points="100,18 116,70 84,70" fill="#bfe9ff" />
            <rect x="84" y="70" width="32" height="110" fill="#d9f2ff" />
            <polygon points="60,46 74,92 46,92" fill="#a9dcff" />
            <rect x="46" y="92" width="28" height="88" fill="#cdebff" />
            <polygon points="140,46 154,92 126,92" fill="#a9dcff" />
            <rect x="126" y="92" width="28" height="88" fill="#cdebff" />
            <!-- 門窗 -->
            <path d="M90 180 v-30 a10 10 0 0 1 20 0 v30 Z" fill="#7fc1ee" />
            <circle cx="100" cy="96" r="7" fill="#eafaff" />
            <!-- 雪花 -->
            <text x="100" y="14" font-size="14" text-anchor="middle">❄️</text>
            <text x="34" y="60" font-size="12" text-anchor="middle">❄️</text>
            <text x="168" y="60" font-size="12" text-anchor="middle">❄️</text>
          </svg>
          <div class="game-name">記憶配對</div>
          <div class="game-region">❄️ 冰雪奇緣冰晶城堡</div>
          <div class="play-pill">開始遊戲 ▶</div>
        </a>

        <!-- 白雪：關係配對 -->
        <a class="castle-card card-snow" href="match.html">
          <span class="ribbon" style="background: #3fa55a">連連看</span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="186" rx="120" ry="20" fill="#bfe6a8" />
            <!-- 城牆 -->
            <rect x="56" y="120" width="88" height="60" fill="#e7e0d4" />
            <rect x="72" y="70" width="56" height="110" fill="#f2ede3" />
            <!-- 圓錐屋頂 -->
            <polygon points="100,30 128,72 72,72" fill="#e0556b" />
            <polygon points="56,96 76,124 36,124" fill="#5a8fd6" />
            <rect x="36" y="124" width="40" height="56" fill="#efe9df" />
            <polygon points="144,96 164,124 124,124" fill="#5a8fd6" />
            <rect x="124" y="124" width="40" height="56" fill="#efe9df" />
            <!-- 門窗 -->
            <path d="M90 180 v-34 a10 10 0 0 1 20 0 v34 Z" fill="#8a5a33" />
            <circle cx="100" cy="92" r="7" fill="#ffe9a8" />
            <!-- 蘋果旗 -->
            <rect x="99" y="14" width="2" height="16" fill="#7a5a33" />
            <text x="108" y="22" font-size="13" text-anchor="middle">🍎</text>
          </svg>
          <div class="game-name">關係配對</div>
          <div class="game-region">🍎 白雪公主古典城堡</div>
          <div class="play-pill">開始遊戲 ▶</div>
        </a>

        <!-- 長髮公主：迷宮闖關 -->
        <a class="castle-card card-rapunzel" href="maze.html">
          <span class="ribbon" style="background: #9b6dff">迷宮</span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="186" rx="118" ry="18" fill="#d8c8f0" />
            <!-- 天燈 -->
            <g fill="#ffce5a">
              <circle cx="42" cy="64" r="4.5" />
              <circle cx="158" cy="78" r="5.5" />
              <circle cx="150" cy="38" r="3.5" />
            </g>
            <!-- 塔身 -->
            <rect x="80" y="58" width="40" height="124" rx="6" fill="#e6dbf7" />
            <path d="M80 96 h40 M80 128 h40 M80 158 h40" stroke="#d3c3f0" stroke-width="2" />
            <!-- 屋頂 -->
            <polygon points="72,60 128,60 100,22" fill="#9b6dff" />
            <rect x="72" y="56" width="56" height="8" rx="4" fill="#8a5cd0" />
            <rect x="99" y="12" width="2.5" height="12" fill="#7a5ad0" />
            <path d="M101 14 l13 4 -13 4 z" fill="#ff7aa8" />
            <!-- 窗 -->
            <rect x="89" y="72" width="22" height="26" rx="11" fill="#ffe9a8" stroke="#caa14e" stroke-width="2" />
            <!-- 長金髮 -->
            <path d="M93 96 Q70 132 86 182" stroke="#ffd86a" stroke-width="7" fill="none" stroke-linecap="round" />
            <path d="M100 98 Q90 140 103 182" stroke="#ffe08a" stroke-width="6" fill="none" stroke-linecap="round" />
            <path d="M107 96 Q128 132 114 182" stroke="#ffd86a" stroke-width="6" fill="none" stroke-linecap="round" />
            <!-- 花藤 -->
            <circle cx="82" cy="118" r="3" fill="#7bd88f" />
            <circle cx="118" cy="138" r="3" fill="#ff8fc7" />
            <circle cx="84" cy="150" r="2.6" fill="#ff8fc7" />
            <circle cx="116" cy="116" r="2.6" fill="#7bd88f" />
          </svg>
          <div class="game-name">迷宮闖關</div>
          <div class="game-region">🗼 長髮公主之塔</div>
          <div class="play-pill">開始遊戲 ▶</div>
        </a>

        <!-- 美女與野獸：貝兒數字挑戰 -->
        <a class="castle-card card-belle" href="cards.html">
          <span class="ribbon" style="background: #d99a3a">算術</span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="186" rx="118" ry="18" fill="#e6cda0" />
            <!-- 側塔 -->
            <rect x="44" y="92" width="30" height="90" fill="#efe1c0" />
            <polygon points="40,92 78,92 59,52" fill="#d99a3a" />
            <rect x="126" y="92" width="30" height="90" fill="#efe1c0" />
            <polygon points="122,92 160,92 141,52" fill="#d99a3a" />
            <!-- 主塔 -->
            <rect x="80" y="64" width="40" height="118" fill="#f5ead0" />
            <polygon points="74,64 126,64 100,26" fill="#e0a800" />
            <!-- 玫瑰花窗 -->
            <circle cx="100" cy="98" r="13" fill="#ffd0e0" stroke="#e0556b" stroke-width="2" />
            <path d="M100 86 v24 M88 98 h24 M91 89 l18 18 M109 89 l-18 18" stroke="#e0556b" stroke-width="1.2" />
            <!-- 城門 -->
            <path d="M90 182 v-30 a10 10 0 0 1 20 0 v30 Z" fill="#9c5b2a" />
            <!-- 旗 -->
            <rect x="99" y="16" width="2" height="12" fill="#b9772a" />
            <path d="M101 18 l12 4 -12 4 z" fill="#e0556b" />
            <!-- 玫瑰與書 -->
            <text x="148" y="180" font-size="26">🌹</text>
            <text x="32" y="178" font-size="20">📖</text>
          </svg>
          <div class="game-name">貝兒數字挑戰</div>
          <div class="game-region">🌹 美女與野獸城堡</div>
          <div class="play-pill">開始遊戲 ▶</div>
        </a>

        <!-- 花木蘭：井字棋 -->
        <a class="castle-card card-mulan" href="tictactoe.html">
          <span class="ribbon" style="background: #d23b3b">井字棋</span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="186" rx="116" ry="16" fill="#e8b48c" />
            <!-- 下層 -->
            <rect x="66" y="120" width="68" height="60" fill="#d23b3b" />
            <rect x="72" y="120" width="6" height="60" fill="#a82a2a" />
            <rect x="122" y="120" width="6" height="60" fill="#a82a2a" />
            <path d="M90 180 v-30 a10 10 0 0 1 20 0 v30 Z" fill="#7a1f1f" />
            <circle cx="104" cy="158" r="2.4" fill="#ffd24d" />
            <!-- 下層屋頂 -->
            <path d="M44 122 Q54 108 42 110 Q70 98 100 98 Q130 98 158 110 Q146 108 156 122 Q100 114 44 122 Z" fill="#e0a800" stroke="#b9772a" stroke-width="1" />
            <!-- 上層 -->
            <rect x="80" y="80" width="40" height="34" fill="#d23b3b" />
            <rect x="90" y="88" width="20" height="16" rx="2" fill="#ffd24d" />
            <!-- 上層屋頂 -->
            <path d="M64 82 Q72 68 62 70 Q84 58 100 58 Q116 58 138 70 Q128 68 136 82 Q100 74 64 82 Z" fill="#e0a800" stroke="#b9772a" stroke-width="1" />
            <!-- 寶頂 -->
            <rect x="98" y="46" width="4" height="12" fill="#e0a800" />
            <circle cx="100" cy="46" r="4" fill="#ffd24d" />
            <!-- 燈籠與花 -->
            <text x="30" y="150" font-size="20">🏮</text>
            <text x="152" y="150" font-size="20">🏮</text>
            <text x="150" y="116" font-size="16">🌸</text>
          </svg>
          <div class="game-name">花木蘭井字棋</div>
          <div class="game-region">🏯 花木蘭宮殿</div>
          <div class="play-pill">開始遊戲 ▶</div>
        </a>

        <!-- 美人魚：數數樂園 -->
        <a class="castle-card card-mermaid" href="math.html">
          <span class="ribbon" style="background: #2a9fc0">數數</span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="188" rx="118" ry="16" fill="#d6f0e4" />
            <!-- 海草 -->
            <path d="M40 188 q-7 -30 5 -52 q-9 26 1 52" fill="#5bbf86" />
            <path d="M162 188 q7 -28 -5 -48 q9 24 -1 48" fill="#5bbf86" />
            <!-- 珊瑚側塔 -->
            <rect x="54" y="112" width="26" height="70" rx="12" fill="#ff9a8b" />
            <circle cx="67" cy="110" r="16" fill="#ff7f6e" />
            <rect x="120" y="112" width="26" height="70" rx="12" fill="#ff9a8b" />
            <circle cx="133" cy="110" r="16" fill="#ff7f6e" />
            <!-- 中央城堡 -->
            <rect x="82" y="86" width="36" height="96" rx="10" fill="#ffb3a0" />
            <path d="M82 88 a18 18 0 0 1 36 0 Z" fill="#ff8f7a" />
            <circle cx="100" cy="68" r="4" fill="#ffd24d" />
            <!-- 貝殼窗 -->
            <path d="M88 132 Q100 110 112 132 Q106 126 100 126 Q94 126 88 132 Z" fill="#fff0e6" />
            <path d="M100 126 v8 M94 128 l-3 6 M106 128 l3 6" stroke="#e8a890" stroke-width="1.2" />
            <!-- 門 -->
            <path d="M92 182 v-22 a8 8 0 0 1 16 0 v22 Z" fill="#c86a5a" />
            <!-- 泡泡 -->
            <g fill="#ffffff" opacity="0.75">
              <circle cx="150" cy="66" r="5" />
              <circle cx="160" cy="46" r="3.5" />
              <circle cx="44" cy="78" r="4" />
            </g>
            <!-- 海星與貝殼 -->
            <text x="150" y="182" font-size="22">⭐</text>
            <text x="30" y="178" font-size="20">🐚</text>
          </svg>
          <div class="game-name">數數樂園</div>
          <div class="game-region">🧜‍♀️ 美人魚海底城堡</div>
          <div class="play-pill">開始遊戲 ▶</div>
        </a>
      </div>

      <p class="footer-note">做給最可愛的小公主 💕 — 用滑鼠或手指點點看吧！</p>
    </div>

    <script src="js/common.js"></script>
    <script>
      MLP.buildSky({ clouds: 6, stars: 16 });
      MLP.mountSoundToggle(document.getElementById("sound-slot"));
      MLP.wireClickSounds();
      // 進場時城堡依序彈跳
      document.querySelectorAll(".castle-card").forEach(function (c, i) {
        c.style.opacity = 0;
        c.style.transform = "translateY(30px)";
        setTimeout(function () {
          c.style.transition = "all .5s cubic-bezier(.2,1.3,.4,1)";
          c.style.opacity = 1;
          c.style.transform = "translateY(0)";
        }, 150 + i * 160);
      });
      // 點城堡時冒星星
      document.querySelectorAll(".castle-card").forEach(function (c) {
        c.addEventListener("click", function (e) {
          MLP.Sound.sparkle();
          MLP.sparkleAt(e.clientX, e.clientY);
        });
      });
    </script>
  </body>
</html>
