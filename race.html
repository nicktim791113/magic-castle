<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>皇宮賽車 · 魔法小皇宮</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ff7ac0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="魔法小皇宮" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>"
    />
    <style>
      body {
        background: linear-gradient(180deg, #ffe0ec 0%, #e9f1ff 55%, #eafff0 100%);
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
      }
      .seg {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.72);
        border-radius: 14px;
        padding: 4px;
        gap: 4px;
        box-shadow: var(--shadow);
      }
      .seg button {
        font-family: var(--font-cute);
        font-weight: 800;
        font-size: 15px;
        border: none;
        background: transparent;
        color: var(--ink);
        padding: 9px 14px;
        border-radius: 11px;
        cursor: pointer;
      }
      .seg button.on {
        background: linear-gradient(180deg, #ff9ec0, #e0556b);
        color: #fff;
      }
      .statrow {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .hearts {
        font-size: 20px;
        letter-spacing: 1px;
      }
      .stage-wrap {
        position: relative;
        width: min(480px, 94vw);
        margin: 0 auto;
      }
      #stage {
        width: 100%;
        aspect-ratio: 480 / 560;
        display: block;
        border-radius: 22px;
        box-shadow: var(--shadow);
        touch-action: none;
        background: #bfe9ff;
      }
      .goal {
        position: absolute;
        left: 10px;
        top: 10px;
        background: rgba(60, 40, 90, 0.82);
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        padding: 8px 14px;
        border-radius: 14px;
        z-index: 4;
        max-width: 80%;
      }
      .toast {
        position: absolute;
        left: 50%;
        top: 56px;
        transform: translateX(-50%);
        background: rgba(224, 85, 107, 0.92);
        color: #fff;
        font-weight: 800;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 15px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        white-space: nowrap;
        z-index: 5;
      }
      .toast.show { opacity: 1; }
      .pad {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin: 14px auto 0;
        width: min(480px, 94vw);
      }
      .pad button {
        flex: 1;
        font-family: var(--font-cute);
        font-weight: 900;
        font-size: 26px;
        border: none;
        border-radius: 18px;
        padding: 16px 0;
        cursor: pointer;
        color: #fff;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12), var(--shadow);
        background: linear-gradient(180deg, #b794ff, #9b6dff);
        user-select: none;
        touch-action: manipulation;
      }
      .pad button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12), var(--shadow); }
      .pad .jump { background: linear-gradient(180deg, #ffd76a, #f2a93f); color: #6a3d00; flex: 1.3; }
      .race-tip {
        text-align: center;
        color: #8a5a6a;
        font-size: 14px;
        margin: 12px 0 0;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="btn ghost btn-back" href="index.html">🏰 回城堡</a>
        <h1>🏎️ 皇宮賽車</h1>
        <span id="sound-slot"></span>
      </div>

      <div class="controls">
        <div class="seg" id="diff-seg">
          <button data-diff="easy" class="on">簡單</button>
          <button data-diff="medium">中等</button>
          <button data-diff="hard">困難</button>
        </div>
        <button class="btn red" id="btn-restart" style="font-size: 15px; padding: 9px 16px">🔄 重新開始</button>
      </div>

      <div class="statrow">
        <span class="badge">🏁 <span id="score">0</span> 分</span>
        <span class="badge hearts" id="hearts">❤️❤️❤️</span>
        <span class="badge" id="best">🏅 最佳 0</span>
      </div>

      <div class="stage-wrap">
        <canvas id="stage"></canvas>
        <div class="goal" id="goal"></div>
        <div class="toast" id="toast"></div>
      </div>

      <div class="pad">
        <button id="btn-left" aria-label="向左">◀</button>
        <button id="btn-jump" class="jump" aria-label="跳躍">⤴ 跳</button>
        <button id="btn-right" aria-label="向右">▶</button>
      </div>

      <p class="race-tip">左右切換車道閃避障礙、按「跳」飛越障礙；撞到左上角的指定目標就得到增益！🏎️</p>
    </div>

    <script src="js/common.js"></script>
    <script src="js/race.js"></script>
  </body>
</html>
